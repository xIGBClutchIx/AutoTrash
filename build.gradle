plugins {
    id 'java'
    id 'org.jetbrains.gradle.plugin.idea-ext' version '1.3'
    id 'com.diffplug.spotless' version '6.25.0'
    id "dev.scaffoldit" version "0.2.+"
}

// Project identity used by manifest generation and publishing metadata.
group = 'me.clutchy.hytale'
version = '1.0.5'

// Cache the resolved server version so manifest configuration and generation
// share one lookup and one log line.
def resolvedServerVersion = null

// Resolve ServerVersion from the Hytale server dependency used at compile time.
def resolveServerVersion = {
    if (resolvedServerVersion != null) {
        return resolvedServerVersion
    }

    def artifact = configurations.findByName('compileClasspath')
        ?.resolvedConfiguration
        ?.resolvedArtifacts
        ?.find { candidate ->
            candidate.moduleVersion.id.group == 'com.hypixel.hytale' && candidate.name == 'Server'
        }

    if (artifact == null) {
        resolvedServerVersion = '*'
        logger.lifecycle("Deps :${project.name}.manifestServerVersion('${resolvedServerVersion}') [source=fallback]")
        return resolvedServerVersion
    }

    resolvedServerVersion = artifact.moduleVersion.id.version
    logger.lifecycle(
        "Deps :${project.name}.manifestServerVersion('${resolvedServerVersion}') [source=com.hypixel.hytale:Server]"
    )
    return resolvedServerVersion
}

def pluginManifest = {
    return [
        Group: project.group.toString(),
        Name: project.name,
        Version: project.version.toString(),
        Main: "me.clutchy.hytale.autotrash.AutoTrashPlugin",
        Description: "Auto-trash filter and configuration UI",
        Authors: [[
            Name: "Clutchy",
            Email: "email@clutchy.me",
            Url: "https://clutchy.me"
        ]],
        IncludesAssetPack: true,
        DisabledByDefault: false,
        ServerVersion: resolveServerVersion()
    ]
}

// Resolve plugins and formatting dependencies.
repositories {
    mavenCentral()
    gradlePluginPortal()
}

// Java toolchain and archive variants.
java {
    toolchain.languageVersion = JavaLanguageVersion.of(25)
    withSourcesJar()
    withJavadocJar()
}

// Source formatting via Spotless + Eclipse formatter.
spotless {
    java {
        eclipse().configFile('eclipse-formatter.xml')
        formatAnnotations()
        trimTrailingWhitespace()
        endWithNewline()
    }
}

// Hytale plugin configuration.
hytale {
    usePatchline("release")
    useVersion("latest")

    manifest {
        pluginManifest().each { key, value ->
            delegate."$key" = value
        }
    }
}

def generatedManifestFile = layout.buildDirectory.file('generated/manifestfactory/manifest.json')

tasks.register('generatePluginManifest') {
    description = 'Generate manifest.json used by the plugin jar packaging.'
    group = 'build'
    outputs.file(generatedManifestFile)

    doLast {
        def manifestFile = generatedManifestFile.get().asFile
        manifestFile.parentFile.mkdirs()
        manifestFile.text = groovy.json.JsonOutput.prettyPrint(
            groovy.json.JsonOutput.toJson(pluginManifest())
        ) + '\n'
    }
}

tasks.named('jar', Jar) {
    from(layout.projectDirectory.file('LICENSE')) {
        into('')
    }
}

// Ensure manifest.json exists before resource processing and copy it into the
// root of packaged resources so it is present in the final plugin jar.
tasks.named('processResources', Copy) {
    dependsOn(tasks.named('generatePluginManifest'))
    dependsOn(tasks.matching { it.name == 'generateManifest' })

    from(generatedManifestFile) {
        into('')
    }
}
